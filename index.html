<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="経営書講義">
<meta name="theme-color" content="#0F0F0F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>[hidden]{display:none!important}*{box-sizing:border-box}</style>
<title>経営書講義ライブラリ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 動画視聴ページの定番の形。上に動画（スクロールしても上に貼りつく）、その下にタイトルと操作、さらに下に「再生リスト」。
   広い画面では左に動画と説明、右に再生リスト。 */
:root{
  --bg:#FFFFFF; --bg2:#F2F2F2; --bg3:#E5E5E5; --fg:#0F0F0F; --fg2:#606060; --line:#E5E5E5;
  --red:#E62117; --chip:#F2F2F2; --chipOn:#0F0F0F; --chipOnFg:#FFFFFF; --sheet:#FFFFFF; --scrim:rgba(0,0,0,.45);
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0F0F; --bg2:#272727; --bg3:#3F3F3F; --fg:#F1F1F1; --fg2:#AAAAAA; --line:#303030;
  --chip:#272727; --chipOn:#F1F1F1; --chipOnFg:#0F0F0F; --sheet:#212121; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F0F; --bg2:#272727; --bg3:#3F3F3F; --fg:#F1F1F1; --fg2:#AAAAAA; --line:#303030;
  --chip:#272727; --chipOn:#F1F1F1; --chipOnFg:#0F0F0F; --sheet:#212121; --scrim:rgba(0,0,0,.6); color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:14px;line-height:1.5;margin:0}
button{font:inherit;color:inherit}
.page{max-width:1700px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:1000px){
  .page{grid-template-columns:minmax(0,1fr) 400px;gap:24px;padding:24px max(24px,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px))}
  .info,.listwrap{padding-left:0!important;padding-right:0!important}
  .stick{position:static!important}
  .screen{border-radius:12px}
}
/* ── プレーヤー ── */
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#000}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#000}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.audiocard{position:absolute;inset:0;display:grid;place-content:center;gap:8px;text-align:center;padding:24px;color:#fff;
  background:radial-gradient(120% 90% at 20% 0%,#2a2a2a 0%,#0b0b0b 70%)}
.audiocard img{width:min(44%,260px);aspect-ratio:16/9;border-radius:8px;justify-self:center;object-fit:cover;opacity:.9}
.audiocard .ttl{font-weight:700;font-size:clamp(15px,2.2vw,22px)}
.audiocard .sub{font-size:12.5px;color:#bbb}
.tapzone{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr 1fr;z-index:2}
.ripple{position:absolute;top:0;bottom:0;width:38%;z-index:3;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.14);opacity:0;pointer-events:none;transition:opacity .35s}
.ripple.l{left:0;border-radius:0 50% 50% 0/0 50% 50% 0}
.ripple.r{right:0;border-radius:50% 0 0 50%/50% 0 0 50%}
.ripple.on{opacity:1;transition:none}
.ripple span{display:grid;justify-items:center;gap:2px}
.ripple svg{width:28px;height:28px;fill:#fff}
.ui{position:absolute;inset:0;z-index:4;pointer-events:none;color:#fff;opacity:0;transition:opacity .2s;
  background:rgba(0,0,0,.42)}
.screen.showui .ui{opacity:1}
.screen.showui .ui button,.screen.showui .ui input{pointer-events:auto}
.uitop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:8px 8px 0 14px}
.uitop .t{flex:1;min-width:0;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0}
.screen.fs .uitop .t{opacity:1;font-size:17px}
.ibtn{border:0;background:transparent;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#fff}
.ibtn svg{width:24px;height:24px;fill:currentColor}
.ibtn:focus-visible,.cbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.uimid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(28px,12vw,96px)}
.cbtn{border:0;background:rgba(0,0,0,.3);border-radius:50%;width:48px;height:48px;display:grid;place-items:center;cursor:pointer;color:#fff}
.cbtn svg{width:30px;height:30px;fill:#fff}
.cbtn.big{width:64px;height:64px}
.cbtn.big svg{width:42px;height:42px}
.cbtn[disabled]{opacity:.35}
.uibot{position:absolute;left:0;right:0;bottom:6px;display:flex;align-items:center;padding:0 6px 0 14px}
.time{font-size:12.5px;font-variant-numeric:tabular-nums;flex:1}
.time b{font-weight:500}
.time span{opacity:.75}
/* 進行バー：常に動画の下端に細く出て、操作中は太くなる */
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:5;pointer-events:none}
.bar i{display:block;height:100%;background:var(--red);width:0}
.screen.showui .bar{opacity:0}
.scrub{position:absolute;left:12px;right:12px;bottom:0;z-index:6;height:24px;display:flex;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
.screen.showui .scrub{opacity:1;pointer-events:auto}
.scrub input{width:100%;margin:0;height:24px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;--p:0%}
.scrub input::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--red) var(--p),rgba(255,255,255,.35) var(--p))}
.scrub input::-moz-range-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--red) var(--p),rgba(255,255,255,.35) var(--p))}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--red);margin-top:-5px;border:0}
.scrub input::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--red);border:0}
.screen.fs .scrub{bottom:56px;left:20px;right:20px}
.screen.fs .uibot{bottom:16px;padding:0 12px 0 22px}
.spin{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none}
.spin i{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 0.9s linear infinite}
.spin em{position:absolute;margin-top:76px;color:#fff;font-style:normal;font-size:12px;opacity:.85}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin i{animation:none}.ui,.ripple{transition:none}}
/* 全画面 */
.screen.fs{position:fixed;inset:0;z-index:60;aspect-ratio:auto;max-width:none;width:100%;height:100%;border-radius:0!important;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
html.fslock,html.fslock body{overflow:hidden}
/* ── 動画の下 ── */
.info{padding:12px max(12px,env(safe-area-inset-right,0px)) 4px max(12px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.info h1{margin:0;font-size:18px;line-height:1.4;font-weight:700;text-wrap:balance}
@media (min-width:1000px){.info h1{font-size:20px}}
.meta{color:var(--fg2);font-size:12.5px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--chip);border-radius:999px;padding:0 14px;height:36px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;font-weight:500;font-size:13.5px}
.chip svg{width:20px;height:20px;fill:currentColor}
.chip[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnFg)}
.chip:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.desc{background:var(--bg2);border-radius:12px;padding:10px 12px;font-size:13.5px;cursor:pointer;border:0;text-align:left;width:100%;white-space:pre-line}
.desc b{display:block;font-weight:700;margin-bottom:2px}
.desc .more{color:var(--fg2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.desc.open .more{-webkit-line-clamp:unset}
.status{margin:0;font-size:13px;padding:8px 12px;border-radius:10px;background:var(--bg2)}
.status.err{border-left:3px solid var(--red)}
/* ── 再生リスト ── */
.listwrap{padding:4px max(12px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.plist{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.phead{padding:12px 14px 8px;display:grid;gap:2px;background:var(--bg2)}
.phead h2{margin:0;font-size:16px;font-weight:700}
.phead .s{color:var(--fg2);font-size:12px}
.tabs{display:flex;gap:8px;padding:8px 14px 10px;background:var(--bg2);margin:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tabs .chip{flex:0 0 auto}
.items{list-style:none;margin:0;padding:6px 0}
@media (min-width:1000px){.items{max-height:calc(100vh - 220px);overflow-y:auto}}
.item{display:grid;grid-template-columns:24px 168px minmax(0,1fr);gap:8px;align-items:start;padding:6px 10px 6px 6px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
@media (max-width:420px){.item{grid-template-columns:22px 140px minmax(0,1fr)}}
.item:hover{background:var(--bg2)}
.item.cur{background:var(--bg3)}
.item .idx{color:var(--fg2);font-size:12px;text-align:center;align-self:center;font-variant-numeric:tabular-nums}
.item.cur .idx{color:var(--fg)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--bg3);display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .dur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.8);color:#fff;font-size:11.5px;font-weight:500;padding:0 4px;border-radius:4px;font-variant-numeric:tabular-nums}
.thumb .pr{position:absolute;left:0;bottom:0;height:3px;background:var(--red)}
.thumb .pbg{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.35)}
.item .tx{min-width:0}
.item .tt{font-size:14px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .pt{color:var(--fg2);font-size:12px;margin-top:2px}
.item .dn{color:var(--fg2);font-size:11.5px}
.item:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
/* ── 設定シート（下から出る） ── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:var(--sheet);color:var(--fg);border-radius:12px 12px 0 0;
  padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--bg3);margin:4px auto 6px}
.srow{display:flex;align-items:center;gap:16px;width:100%;border:0;background:none;padding:12px max(18px,env(safe-area-inset-left,0px));text-align:left;cursor:pointer;font-size:15px}
.srow svg{width:24px;height:24px;fill:currentColor;flex:none}
.srow .v{margin-left:auto;color:var(--fg2);font-size:14px}
.srow:hover{background:var(--bg2)}
.srow.sel::after{content:"✓";margin-left:auto;font-weight:700}
.shead{padding:6px 18px 6px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.shead button{border:0;background:none;width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.shead svg{width:22px;height:22px;fill:currentColor}
.sheet.fsmode{z-index:91}.scrim.fsmode{z-index:90}
</style>

<div class="page">
  <div class="col-main">
    <div class="stick">
      <div class="screen" id="screen">
        <video id="vid" playsinline muted preload="metadata" autopictureinpicture></video>
        <div class="audiocard" id="audiocard" hidden>
          <img id="acImg" alt="">
          <div class="ttl" id="acTitle"></div>
          <div class="sub">音声のみで再生中</div>
        </div>
        <div class="spin" id="spin" hidden><i></i><em id="spinTxt"></em></div>
        <div class="tapzone" id="tapzone" aria-hidden="true"><div class="tz" data-side="-1"></div><div class="tz" data-side="0"></div><div class="tz" data-side="1"></div></div>
        <div class="ripple l" id="ripL"><span><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6zm.5-6 8.5 6V6z"/></svg><b id="ripLt">10秒</b></span></div>
        <div class="ripple r" id="ripR"><span><svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6zm9-12v12l8.5-6z"/></svg><b id="ripRt">10秒</b></span></div>
        <div class="ui" id="ui">
          <div class="uitop">
            <span class="t" id="uiTitle"></span>
            <button class="ibtn" id="bPip" aria-label="小窓で再生" hidden><svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8zm2-4H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H3V5h18z"/></svg></button>
            <button class="ibtn" id="bSettings" aria-label="設定"><svg viewBox="0 0 24 24"><path d="M19.1 12.9a7.3 7.3 0 0 0 0-1.8l2-1.6-1.9-3.3-2.4 1a7 7 0 0 0-1.6-.9L14.9 4h-3.8l-.3 2.3a7 7 0 0 0-1.6.9l-2.4-1-1.9 3.3 2 1.6a7.3 7.3 0 0 0 0 1.8l-2 1.6 1.9 3.3 2.4-1a7 7 0 0 0 1.6.9l.3 2.3h3.8l.3-2.3a7 7 0 0 0 1.6-.9l2.4 1 1.9-3.3zM13 15.3a3.3 3.3 0 1 1 0-6.6 3.3 3.3 0 0 1 0 6.6z" transform="translate(-1 0)"/></svg></button>
          </div>
          <div class="uimid">
            <button class="cbtn" id="bPrev" aria-label="前の章"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
            <button class="cbtn big" id="bPlay" aria-label="再生"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
            <button class="cbtn" id="bNext" aria-label="次の章"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6v12h2V6z"/></svg></button>
          </div>
          <div class="uibot">
            <span class="time"><b id="tCur">0:00</b><span> / <span id="tDur">0:00</span></span></span>
            <button class="ibtn" id="bRotate" aria-label="横向きに回転" hidden><svg viewBox="0 0 24 24"><path d="M16.5 2.5 15 4l1.6 1.6A7.5 7.5 0 0 0 4.5 12H6.6a5.5 5.5 0 0 1 8.6-4.5L13.6 9.1 15 10.5l3-3-1.5-1.5zm-9 19L9 20l-1.6-1.6A7.5 7.5 0 0 0 19.5 12h-2.1a5.5 5.5 0 0 1-8.6 4.5l1.6-1.6L9 13.5l-3 3z"/></svg></button>
            <button class="ibtn" id="bFS" aria-label="全画面"><svg viewBox="0 0 24 24" id="fsIcon"><path d="M5 10V5h5v2H7v3zm9-5h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 3v-3h2v5h-5v-2z"/></svg></button>
          </div>
        </div>
        <div class="scrub"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="再生位置"></div>
        <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
      </div>
    </div>
    <section class="info" aria-label="再生中の講義">
      <h1 id="nowTitle">章を選んでください</h1>
      <div class="meta" id="nowMeta"></div>
      <div class="chips">
        <button class="chip" id="cAudio" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h2v-8H5v-1a7 7 0 0 1 14 0v1h-3v8h2a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9z"/></svg>音声のみ</button>
        <button class="chip" id="cRate"><svg viewBox="0 0 24 24"><path d="M12 4a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7zm1 2v6.6l4.2 2.4 1-1.7-3.2-1.9V6z"/></svg><span id="cRateT">1.0×</span></button>
        <button class="chip" id="cAuto" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 6h11v2H4zm0 5h11v2H4zm0 5h7v2H4zm12-1v6l5-3z"/></svg>自動再生</button>
        <button class="chip" id="cPip" hidden><svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8zm2-4H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H3V5h18z"/></svg>小窓で再生</button>
        <button class="chip" id="cFS"><svg viewBox="0 0 24 24"><path d="M5 10V5h5v2H7v3zm9-5h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 3v-3h2v5h-5v-2z"/></svg>全画面</button>
      </div>
      <button class="desc" id="desc"><b id="descHead"></b><span class="more" id="descBody"></span></button>
      <p class="status" id="status" role="status" hidden></p>
    </section>
  </div>
  <aside class="listwrap" aria-label="再生リスト">
    <div class="plist">
      <div class="phead"><h2 id="plTitle"></h2><div class="s" id="plSub"></div></div>
      <div class="tabs chips" id="tabs"></div>
      <ul class="items" id="items"></ul>
    </div>
  </aside>
</div>

    else if (e.key === 'j' || e.key === 'ArrowLeft') { e.preventDefault(); const s = e.key === 'j' ? 10 : 5; skip(-s); ripple(-1, s); }
    else if (e.key === 'l' || e.key === 'ArrowRight') { e.preventDefault(); const s = e.key === 'l' ? 10 : 5; skip(s); ripple(1, s); }
    else if (e.key === 'N' && e.shiftKey) step(1);
    else if (e.key === 'P' && e.shiftKey) step(-1);
  });

  // ── ロック画面の操作 ─────────────────────────────────────
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession, set = (a, f) => { try { ms.setActionHandler(a, f); } catch(e){} };
    set('play', () => aud.play().catch(playErr)); set('pause', () => aud.pause());
    set('previoustrack', () => step(-1)); set('nexttrack', () => step(1));
    set('seekbackward', d => skip(-((d && d.seekOffset) || 10))); set('seekforward', d => skip((d && d.seekOffset) || 10));
    set('seekto', d => { if (d && d.seekTime != null && aud.dataset.ready === '1') { aud.currentTime = d.seekTime; syncVideo(true); } });
  }

  // ── 小窓で再生（ピクチャー・イン・ピクチャー） ───────────────
  // 音は今まで通り音声ファイルから流し、小窓には映像だけを出す。小窓の再生・停止・早送りは音声にも反映する。
  const pipOK = !!((document.pictureInPictureEnabled && vid.requestPictureInPicture) ||
    (vid.webkitSupportsPresentationMode && vid.webkitSupportsPresentationMode('picture-in-picture')));
  $('bPip').hidden = !pipOK; $('cPip').hidden = !pipOK;
  function setPip(on){ pip = on; $('cPip').setAttribute('aria-pressed', on); if (on) syncVideo(true); }
  async function togglePip(){
    try {
      if (pip) {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else if (vid.webkitSetPresentationMode) vid.webkitSetPresentationMode('inline');
        return;
      }
      if (mode !== 'video') setMode('video');
      if (!curKey) { const f = playable()[0]; if (f) load(keyOf(f), true); }
      if (aud.paused && aud.dataset.ready === '1') aud.play().catch(playErr);
      if (vid.readyState < 1) await new Promise(r => vid.addEventListener('loadedmetadata', r, {once: true}));
      syncVideo(true);
      if (vid.requestPictureInPicture && document.pictureInPictureEnabled) await vid.requestPictureInPicture();
      else if (vid.webkitSetPresentationMode) vid.webkitSetPresentationMode('picture-in-picture');
    } catch(e) { say('小窓で再生できませんでした（' + (e && e.name || '') + '）。動画を再生してから、もう一度押してください。', true); }
  }
  vid.addEventListener('enterpictureinpicture', () => setPip(true));
  vid.addEventListener('leavepictureinpicture', () => { setPip(false); syncVideo(true); });
  vid.addEventListener('webkitpresentationmodechanged', () => {
    nativeFS = vid.webkitPresentationMode === 'fullscreen';
    setPip(vid.webkitPresentationMode === 'picture-in-picture'); syncVideo(true);
  });
  vid.addEventListener('webkitbeginfullscreen', () => { nativeFS = true; syncVideo(true); });
  vid.addEventListener('webkitendfullscreen', () => { nativeFS = false; syncVideo(true); });
  vid.addEventListener('volumechange', () => { if (!vid.muted) vid.muted = true; });   // 音は音声ファイル側から出すので、映像は常に消音
  // 小窓のボタン操作（再生・停止・送り）を音声にも反映
  vid.addEventListener('pause', () => { if (ext() && Date.now() - internalPause > 400 && !aud.paused && !vid.ended) aud.pause(); });
  vid.addEventListener('play', () => { if (ext() && aud.paused && aud.dataset.ready === '1') aud.play().catch(()=>{}); });
  vid.addEventListener('seeked', () => {
    if (ext() && Date.now() - internalSeek > 600 && aud.dataset.ready === '1' && Math.abs(vid.currentTime - aud.currentTime) > 1) aud.currentTime = vid.currentTime;
  });
  $('bPip').onclick = () => { togglePip(); showUI(); };
  $('cPip').onclick = () => togglePip();

  function restore(){
    const last = store.get('last:' + book().id, null);
    const c = (last && byKey(last) && byKey(last).src) ? byKey(last) : playable()[0];
    if (c) load(keyOf(c), false);
  }

  $('cRateT').textContent = rateText(rate); $('cAuto').setAttribute('aria-pressed', autoNext);
  // 引っ越し前の視聴記録（単独版の初回だけ取り込む）
  try { const SEED = JSON.parse(document.getElementById('seed').textContent || 'null'); if (SEED && !store.get('seeded', false)) { merge(SEED); store.set('seeded', true); } } catch(e) {}
  applyMode(); restore(); paintPlay(); paintFS(); showUI(true); initCloud();
})();
</script>
